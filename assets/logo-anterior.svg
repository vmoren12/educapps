<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Logo anterior (fins a l'octubre del 2026), per si cal recuperar-lo.
    A la capçalera de cada pàgina anava amb el text «EducApps» i aquests estils:
      .brand-mark { width: 30px; height: 30px; }
      .brand-mark .logo-bg { fill: var(--accent); }
      .brand-mark .logo-fg { fill: none; stroke: var(--accent-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .brand-mark .logo-dot { fill: var(--accent-ink); }
      .brand-name { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 600; letter-spacing: -0.01em; }
    La icona del navegador corresponent és assets/favicon-anterior.svg.
  -->
  <style>
    .bg { fill: #1f5f5b; } .fg { fill: none; stroke: #fff; } .dot { fill: #fff; }
    @media (prefers-color-scheme: dark) { .bg { fill: #72c4ba; } .fg { stroke: #0c1e1c; } .dot { fill: #0c1e1c; } }
  </style>
  <rect class="bg" x="2" y="2" width="28" height="28" rx="8"/>
  <path class="fg" d="M9 23V9h14M9 16h9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="dot" cx="21.5" cy="21.5" r="2.5"/>
</svg>
