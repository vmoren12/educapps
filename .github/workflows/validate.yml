name: Valida el catàleg

on:
  push:
    paths: ["data/**", "scripts/validate-apps.mjs", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "scripts/validate-apps.mjs", ".github/workflows/validate.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-apps.mjs
